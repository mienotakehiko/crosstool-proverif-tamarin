events=["EvA(I)"]
outputs=["seal(I)", "tup('a', I)"]
[[thread.step]]
name="Second"
domain={q=[1]}
input="tup('a', seal(I))"
update={q="2"}
events=["EvB(I)"]
outputs=[]
[[property]]
name="exec"
kind="phi3"
events=["EvA(I)","EvB(I)"]
