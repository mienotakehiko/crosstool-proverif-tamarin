# Generated by make_family.py (experiment E1). Edit the script, not this file.
name = "LMOTS_W3M1"

[meta]
parameters = "w = 3, message digits = 1, checksum chain of length 7"

[signature]
functions = [
  { name = "ch",  arity = 3 },
  { name = "prf", arity = 2, private = true },
]

[macros]
up = { params = ["I", "d", "n", "t"], body = "t if n == 0 else ch(I, d, up(I, d, n - 1, t))" }
pk = { params = ["I", "sd"], body = "tup(up(I, 'm1', 7, prf(sd, 'm1')), up(I, 'k', 7, prf(sd, 'k')))" }

[thread]
role    = "Signer"
fresh   = ["I", "sd"]
state   = ["q"]
init    = { q = 0 }
bound   = 1
publish = "tup(I, pk(I, sd))"
persist = [ { name = "Pk", term = "pk(I, sd)" } ]

[[thread.leak]]
event  = "RevealSeed(I)"
output = "sd"

[[thread.step]]
name    = "Sign"
domain  = { q = [0], a1 = [0, 1, 2, 3, 4, 5, 6, 7] }
input   = "tup('sign', a1)"
update  = { q = "q + 1" }
events  = ["Sign(I, a1)"]
outputs = ["tup(I, a1, up(I, 'm1', a1, prf(sd, 'm1')), up(I, 'k', 7 - a1, prf(sd, 'k')))"]

[[responder]]
name   = "Verify"
domain = { a1 = [0, 1, 2, 3, 4, 5, 6, 7] }
input  = "tup(I, a1, s1, sk)"
check  = { Pk = "tup(up(I, 'm1', 7 - a1, s1), up(I, 'k', a1, sk))" }
events = ["Accept(I, a1)"]

[[property]]
name   = "exec_accept"
kind   = "phi3"
events = ["Sign(I, a1)", "Accept(I, a1)"]
absent = ["RevealSeed(I)"]

[[property]]
name       = "LS1_unforge"
kind       = "phi1"
premise    = "Accept(I, a1)"
conclusion = [["Sign(I, a1)"], ["RevealSeed(I)"]]

[[property]]
name   = "forge"
kind   = "phi3"
events = ["Accept(I, a1)"]
absent = ["Sign(I, a1)", "RevealSeed(I)"]
