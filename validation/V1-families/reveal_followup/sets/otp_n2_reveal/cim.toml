# Generated by make_reveal_inputs.py from otp_n2.toml of series V1. Edit the script, not this file.
# Hash-chain one-time passwords. The seed sd defines the passwords
# x_j = h^(n-j)(sd) for j = 0 .. n-1 and the public anchor h^(n+1)(sd); the
# seed itself leaves the thread only through the leak. The state has two
# counters: rel_count counts the passwords that the user has released, v counts the
# logins that the verifier has accepted. A login with counter v needs x_v.
name = "OTP_N2_REVEAL"

[meta]
parameters = "chain length n = 2, state (rel_count, v)"

[signature]
functions = [
  { name = "h", arity = 2 },
]

[macros]
up = { params = ["I", "n", "t"], body = "t if n == 0 else h(I, up(I, n - 1, t))" }

[thread]
role    = "User"
fresh   = ["I", "sd"]
state   = ["rel_count", "v"]
init    = { rel_count = 0, v = 0 }
bound   = 4
publish = "tup(I, up(I, 3, sd))"

[[thread.leak]]
event  = "RevealSeed(I)"
output = "sd"

[[thread.step]]
name    = "Release"
domain  = { rel_count = [0, 1], v = [0, 1, 2] }
input   = "tup('rel', rel_count)"
update  = { rel_count = "rel_count + 1" }
events  = ["Rel(I, rel_count)"]
outputs = ["tup(I, rel_count, up(I, 2 - rel_count, sd))"]

[[thread.step]]
name    = "Login"
domain  = { rel_count = [0, 1, 2], v = [0, 1] }
input   = "tup('login', up(I, 2 - v, sd))"
update  = { v = "v + 1" }
events  = ["Acc(I, v)"]

[[property]]
name       = "Auth"
kind       = "phi1"
premise    = "Acc(I, q)"
conclusion = [["Rel(I, q)"], ["RevealSeed(I)"]]

[[property]]
name   = "Forge"
kind   = "phi3"
events = ["Acc(I, q)"]
absent = ["Rel(I, q)", "RevealSeed(I)"]

[[property]]
name       = "Auth_noreveal"
kind       = "phi1"
premise    = "Acc(I, q)"
conclusion = [["Rel(I, q)"]]

[[property]]
name   = "Forge_noreveal"
kind   = "phi3"
events = ["Acc(I, q)"]
absent = ["Rel(I, q)"]
