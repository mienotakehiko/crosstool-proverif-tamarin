# Generated by make_family.py (experiment E1). Edit the script, not this file.
name = "LMS_H3W1"

[meta]
parameters = "h = 3 (8 leaves), w = 1, p = 2"

[signature]
functions = [
  { name = "ch",  arity = 3 },
  { name = "prf", arity = 3, private = true },
  { name = "hl",  arity = 3 },
]

[macros]
up     = { params = ["I", "d", "n", "t"], body = "t if n == 0 else ch(I, d, up(I, d, n - 1, t))" }
leafpk = { params = ["I", "sd", "q"], body = "tup(up(I, 'm', 1, prf(sd, q, 'm')), up(I, 'k', 1, prf(sd, q, 'k')))" }
root   = { params = ["I", "sd"], body = "hl(I, hl(I, hl(I, leafpk(I, sd, 0), leafpk(I, sd, 1)), hl(I, leafpk(I, sd, 2), leafpk(I, sd, 3))), hl(I, hl(I, leafpk(I, sd, 4), leafpk(I, sd, 5)), hl(I, leafpk(I, sd, 6), leafpk(I, sd, 7))))" }

[thread]
role    = "Signer"
fresh   = ["I", "sd"]
state   = ["q"]
init    = { q = 0 }
bound   = 8
persist = [ { name = "Root", term = "root(I, sd)" } ]

[[thread.leak]]
event  = "RevealSeed(I)"
output = "sd"

[[thread.step]]
name    = "Sign"
domain  = { q = [0, 1, 2, 3, 4, 5, 6, 7], a = [0, 1] }
input   = "tup('sign', a)"
update  = { q = "q + 1" }
events  = ["Sign(I, q, a)"]
outputs = ["tup(I, q, a, up(I, 'm', a, prf(sd, q, 'm')), up(I, 'k', 1 - a, prf(sd, q, 'k')), leafpk(I, sd, 1), hl(I, leafpk(I, sd, 2), leafpk(I, sd, 3)), hl(I, hl(I, leafpk(I, sd, 4), leafpk(I, sd, 5)), hl(I, leafpk(I, sd, 6), leafpk(I, sd, 7)))) if q == 0 else tup(I, q, a, up(I, 'm', a, prf(sd, q, 'm')), up(I, 'k', 1 - a, prf(sd, q, 'k')), leafpk(I, sd, 0), hl(I, leafpk(I, sd, 2), leafpk(I, sd, 3)), hl(I, hl(I, leafpk(I, sd, 4), leafpk(I, sd, 5)), hl(I, leafpk(I, sd, 6), leafpk(I, sd, 7)))) if q == 1 else tup(I, q, a, up(I, 'm', a, prf(sd, q, 'm')), up(I, 'k', 1 - a, prf(sd, q, 'k')), leafpk(I, sd, 3), hl(I, leafpk(I, sd, 0), leafpk(I, sd, 1)), hl(I, hl(I, leafpk(I, sd, 4), leafpk(I, sd, 5)), hl(I, leafpk(I, sd, 6), leafpk(I, sd, 7)))) if q == 2 else tup(I, q, a, up(I, 'm', a, prf(sd, q, 'm')), up(I, 'k', 1 - a, prf(sd, q, 'k')), leafpk(I, sd, 2), hl(I, leafpk(I, sd, 0), leafpk(I, sd, 1)), hl(I, hl(I, leafpk(I, sd, 4), leafpk(I, sd, 5)), hl(I, leafpk(I, sd, 6), leafpk(I, sd, 7)))) if q == 3 else tup(I, q, a, up(I, 'm', a, prf(sd, q, 'm')), up(I, 'k', 1 - a, prf(sd, q, 'k')), leafpk(I, sd, 5), hl(I, leafpk(I, sd, 6), leafpk(I, sd, 7)), hl(I, hl(I, leafpk(I, sd, 0), leafpk(I, sd, 1)), hl(I, leafpk(I, sd, 2), leafpk(I, sd, 3)))) if q == 4 else tup(I, q, a, up(I, 'm', a, prf(sd, q, 'm')), up(I, 'k', 1 - a, prf(sd, q, 'k')), leafpk(I, sd, 4), hl(I, leafpk(I, sd, 6), leafpk(I, sd, 7)), hl(I, hl(I, leafpk(I, sd, 0), leafpk(I, sd, 1)), hl(I, leafpk(I, sd, 2), leafpk(I, sd, 3)))) if q == 5 else tup(I, q, a, up(I, 'm', a, prf(sd, q, 'm')), up(I, 'k', 1 - a, prf(sd, q, 'k')), leafpk(I, sd, 7), hl(I, leafpk(I, sd, 4), leafpk(I, sd, 5)), hl(I, hl(I, leafpk(I, sd, 0), leafpk(I, sd, 1)), hl(I, leafpk(I, sd, 2), leafpk(I, sd, 3)))) if q == 6 else tup(I, q, a, up(I, 'm', a, prf(sd, q, 'm')), up(I, 'k', 1 - a, prf(sd, q, 'k')), leafpk(I, sd, 6), hl(I, leafpk(I, sd, 4), leafpk(I, sd, 5)), hl(I, hl(I, leafpk(I, sd, 0), leafpk(I, sd, 1)), hl(I, leafpk(I, sd, 2), leafpk(I, sd, 3))))"]

[[responder]]
name   = "Verify"
domain = { q = [0, 1, 2, 3, 4, 5, 6, 7], a = [0, 1] }
input  = "tup(I, q, a, sm, sk, s0, s1, s2)"
check  = { Root = "hl(I, hl(I, hl(I, tup(up(I, 'm', 1 - a, sm), up(I, 'k', a, sk)), s0), s1), s2) if q == 0 else hl(I, hl(I, hl(I, s0, tup(up(I, 'm', 1 - a, sm), up(I, 'k', a, sk))), s1), s2) if q == 1 else hl(I, hl(I, s1, hl(I, tup(up(I, 'm', 1 - a, sm), up(I, 'k', a, sk)), s0)), s2) if q == 2 else hl(I, hl(I, s1, hl(I, s0, tup(up(I, 'm', 1 - a, sm), up(I, 'k', a, sk)))), s2) if q == 3 else hl(I, s2, hl(I, hl(I, tup(up(I, 'm', 1 - a, sm), up(I, 'k', a, sk)), s0), s1)) if q == 4 else hl(I, s2, hl(I, hl(I, s0, tup(up(I, 'm', 1 - a, sm), up(I, 'k', a, sk))), s1)) if q == 5 else hl(I, s2, hl(I, s1, hl(I, tup(up(I, 'm', 1 - a, sm), up(I, 'k', a, sk)), s0))) if q == 6 else hl(I, s2, hl(I, s1, hl(I, s0, tup(up(I, 'm', 1 - a, sm), up(I, 'k', a, sk)))))" }
events = ["Accept(I, q, a)"]

[[property]]
name   = "exec"
kind   = "phi3"
events = ["Sign(I, q, a)", "Accept(I, q, a)"]
absent = ["RevealSeed(I)"]

[[property]]
name       = "LS4_pure"
kind       = "phi2"
premise    = ["Sign(I, q, a1)@i", "Sign(I, q, a2)@j"]
conclusion = "i = j"
induction  = true

[[property]]
name       = "LS4"
kind       = "phi2"
premise    = ["Sign(I, q, a1)@i", "Sign(I, q, a2)@j"]
conclusion = "i = j"
induction  = true
misuse_exception = "I"

[[property]]
name       = "LS1"
kind       = "phi1"
premise    = "Accept(I, q, a)"
conclusion = [["Sign(I, q, a)"], ["RevealSeed(I)"]]

[[property]]
name   = "LS3_forge"
