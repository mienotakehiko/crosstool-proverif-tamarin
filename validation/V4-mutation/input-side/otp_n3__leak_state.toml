# Generated by make_family.py (experiment E1). Edit the script, not this file.
# Hash-chain one-time passwords. The seed sd defines the passwords
# x_j = h^(n-j)(sd) for j = 0 .. n-1 and the public anchor h^(n+1)(sd); the
# seed itself leaves the thread only through the leak. The state has two
# counters: c counts the passwords that the user has released, v counts the
# logins that the verifier has accepted. A login with counter v needs x_v.
name = "OTP_N3"

[meta]
parameters = "chain length n = 3, state (c, v)"

[signature]
functions = [
  { name = "h", arity = 2 },
]

[macros]
up = { params = ["I", "n", "t"], body = "t if n == 0 else h(I, up(I, n - 1, t))" }

[thread]
role    = "User"
fresh   = ["I", "sd"]
state   = ["c", "v"]
init    = { c = 0, v = 0 }
bound   = 6
publish = "tup(I, up(I, 4, sd))"

[[thread.leak]]
event  = "RevealSeed(I)"
output = "c"

[[thread.step]]
name    = "Release"
domain  = { c = [0, 1, 2], v = [0, 1, 2, 3] }
input   = "tup('rel', c)"
update  = { c = "c + 1" }
events  = ["Rel(I, c)"]
outputs = ["tup(I, c, up(I, 3 - c, sd))"]

[[thread.step]]
name    = "Login"
domain  = { c = [0, 1, 2, 3], v = [0, 1, 2] }
input   = "tup('login', up(I, 3 - v, sd))"
update  = { v = "v + 1" }
events  = ["Acc(I, v)"]

[[property]]
name   = "exec"
kind   = "phi3"
events = ["Rel(I, q)", "Acc(I, q)"]
absent = ["RevealSeed(I)"]

[[property]]
name       = "NoReplay_pure"
kind       = "phi2"
premise    = ["Acc(I, q)@i", "Acc(I, q)@j"]
conclusion = "i = j"
induction  = true

[[property]]
name       = "NoReplay"
kind       = "phi2"
premise    = ["Acc(I, q)@i", "Acc(I, q)@j"]
conclusion = "i = j"
induction  = true
misuse_exception = "I"

[[property]]
name       = "Auth"
kind       = "phi1"
premise    = "Acc(I, q)"
conclusion = [["Rel(I, q)"], ["RevealSeed(I)"]]

[[property]]
name   = "Forge"
kind   = "phi3"
events = ["Acc(I, q)"]
absent = ["Rel(I, q)", "RevealSeed(I)"]
