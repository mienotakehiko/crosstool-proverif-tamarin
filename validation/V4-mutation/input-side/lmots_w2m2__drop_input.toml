# Generated by make_family.py (experiment E1). Edit the script, not this file.
name = "LMOTS_W2M2"

[meta]
parameters = "w = 2, message digits = 2, checksum chain of length 6"

[signature]
functions = [
  { name = "ch",  arity = 3 },
  { name = "prf", arity = 2, private = true },
]

[macros]
up = { params = ["I", "d", "n", "t"], body = "t if n == 0 else ch(I, d, up(I, d, n - 1, t))" }
pk = { params = ["I", "sd"], body = "tup(up(I, 'm1', 3, prf(sd, 'm1')), up(I, 'm2', 3, prf(sd, 'm2')), up(I, 'k', 6, prf(sd, 'k')))" }

[thread]
role    = "Signer"
fresh   = ["I", "sd"]
state   = ["q"]
init    = { q = 0 }
bound   = 1
publish = "tup(I, pk(I, sd))"
persist = [ { name = "Pk", term = "pk(I, sd)" } ]

[[thread.leak]]
event  = "RevealSeed(I)"
output = "sd"

[[thread.step]]
name    = "Sign"
domain  = { q = [0], a1 = [0, 1, 2, 3], a2 = [0, 1, 2, 3] }
update  = { q = "q + 1" }
events  = ["Sign(I, a1, a2)"]
outputs = ["tup(I, a1, a2, up(I, 'm1', a1, prf(sd, 'm1')), up(I, 'm2', a2, prf(sd, 'm2')), up(I, 'k', 6 - a1 - a2, prf(sd, 'k')))"]

[[responder]]
name   = "Verify"
domain = { a1 = [0, 1, 2, 3], a2 = [0, 1, 2, 3] }
input  = "tup(I, a1, a2, s1, s2, sk)"
check  = { Pk = "tup(up(I, 'm1', 3 - a1, s1), up(I, 'm2', 3 - a2, s2), up(I, 'k', a1 + a2, sk))" }
events = ["Accept(I, a1, a2)"]

[[property]]
name   = "exec_accept"
kind   = "phi3"
events = ["Sign(I, a1, a2)", "Accept(I, a1, a2)"]
absent = ["RevealSeed(I)"]

[[property]]
name       = "LS1_unforge"
kind       = "phi1"
premise    = "Accept(I, a1, a2)"
conclusion = [["Sign(I, a1, a2)"], ["RevealSeed(I)"]]

[[property]]
name   = "forge"
kind   = "phi3"
events = ["Accept(I, a1, a2)"]
absent = ["Sign(I, a1, a2)", "RevealSeed(I)"]
