# Boundary probe b03 (outside the fragment): two cases of one state have
# unifiable input patterns, so one message selects both ProVerif blocks.
name = "B03"

[signature]
functions = [ { name = "h", arity = 2 } ]

[thread]
role    = "Actor"
fresh   = ["I", "sd"]
state   = ["q"]
init    = { q = 0 }
bound   = 1
publish = "I"

[[thread.step]]
name    = "Any"
domain  = { q = [0] }
input   = "tup('go', z)"
update  = { q = "q + 1" }
events  = ["EvA(I)"]

[[thread.step]]
name    = "One"
domain  = { q = [0] }
input   = "tup('go', 'a')"
update  = { q = "q + 1" }
events  = ["EvB(I)"]

[[property]]
name   = "both"
kind   = "phi3"
events = ["EvA(I)", "EvB(I)"]
